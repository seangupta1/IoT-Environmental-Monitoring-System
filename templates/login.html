<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Spring 2025 IOT</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page-body">
    <div class="card login-container">
        <h2 class="title" style="border: none; padding-bottom: 0;">Spring 2025 - IOT</h2>
        <p style="text-align: center; color: #666;">Welcome, please sign in</p>
        
        <form action="/login" method="POST">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Enter username" autofocus>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" name="password" required placeholder="Enter password">
                    <span class="toggle-password" onclick="togglePassword()">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </span>
                </div>
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%;">Login</button>
        </form>

        <div class="links">
            <span style="color: #ccc; margin: 0 5px;">•</span>
            <a href="/register">Create account</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const icon = document.getElementById("eyeIcon");
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                // Remove the slash/line through the eye when showing password
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            } else {
                passwordInput.type = 'password';
                // Put the slash back when hiding password
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            }    
        }
    </script>
</body>
</html>
